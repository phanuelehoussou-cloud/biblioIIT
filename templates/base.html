<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BiblioIIT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand navbar-dark mb-4">
        <div class="container">
        <a class="navbar-brand" href="{{ url_for('livres') }}">BiblioIIT</a>
        <div class="navbar-nav">
            <a class="nav-link" href="{{ url_for('livres') }}">Livres</a>
            <a class="nav-link" href="{{ url_for('adherents') }}">Adhérents</a>
            <a class="nav-link" href="{{ url_for('emprunts') }}">Emprunts</a>
            <a class="nav-link" href="{{ url_for('reservations') }}">Réservations</a>
        </div>
        </div>
    </nav>

    <div class="container pb-5">
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% for categorie, message in messages %}
            <div class="alert alert-{{ categorie }} alert-dismissible fade show">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        {% endfor %}
        {% endwith %}
        {% block contenu %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
